<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Google</title>
</head>

<body>
    <div class="top">
        <a href="" title="">Gmail</a>
        <a href="" title="">Imagens</a>
        <span class="material-icons-outlined apps">
            apps
        </span>
        <span class="material-icons-outlined account">
            account_circle
        </span>
    </div>

    <div class="main">
        <img src="https://images.google.com/images/branding/googlelogo/1x/googlelogo_light_color_272x92dp.png" alt="">

        <div class="search">
            <div class="search-field">
                <span class="material-icons-outlined">
                    add
                </span>
                <input type="text">
                <span class="material-icons-outlined">
                    keyboard
                </span>
                <span class="material-icons-outlined">
                    mic
                </span>
                <span class="material-icons-outlined">
                    image_search
                </span>
                <span class="material-icons-outlined search-icon">
                    search
                </span>
            </div>
        </div>
        <div class="buttons">
            <button>Pesquisa Google</button>
            <button>Estou com sorte</button>
        </div>
    </div>
</body>

</html>
